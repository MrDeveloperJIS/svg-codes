<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="favicon.ico">
    <title>svg-codes dist test</title>
    <style>
        :root {
            --bg: #0c0c0c;
            --fg: #f0f8ff;
            --line: rgba(240, 248, 255, .2);
            --dim: rgba(240, 248, 255, .65);
            --ok: #7fd48a;
            --bad: #ff7b7b;
            --s1: 8px;
            --s2: 16px;
            --s3: 24px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
            margin: 0;
            padding: var(--s2);
            padding-left: max(var(--s2), env(safe-area-inset-left));
            padding-right: max(var(--s2), env(safe-area-inset-right));
            padding-bottom: max(var(--s2), env(safe-area-inset-bottom));
        }

        main {
            max-width: 720px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 var(--s1);
        }

        h2 {
            font-size: 16px;
            margin: 0 0 var(--s2);
        }

        p {
            margin: 0 0 var(--s2);
            color: var(--dim);
            font-size: 14px;
        }

        section {
            border-top: 1px solid var(--line);
            padding: var(--s2) 0 var(--s3);
        }

        #summary {
            font-size: 18px;
            font-weight: 600;
            margin: var(--s2) 0;
        }

        #summary.ok {
            color: var(--ok);
        }

        #summary.bad {
            color: var(--bad);
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        li {
            padding: 4px 0;
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        li b {
            display: inline-block;
            min-width: 4.5em;
        }

        li.ok b {
            color: var(--ok);
        }

        li.bad b {
            color: var(--bad);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: var(--s2);
        }

        figure {
            margin: 0;
            min-width: 0;
        }

        .box {
            background: #fff;
        }

        .box svg {
            display: block;
            width: 100%;
            height: auto;
            max-height: 180px;
        }

        figcaption {
            font-size: 12px;
            color: var(--dim);
            margin-top: 4px;
            overflow-wrap: anywhere;
        }

        figcaption b {
            color: var(--fg);
        }

        figure.ok figcaption b {
            color: var(--ok);
        }

        figure.bad figcaption b {
            color: var(--bad);
        }
    </style>
</head>

<body>
    <main>
        <h1>svg-codes dist test</h1>
        <p>Loads <code>dist/svg-codes.js</code> with a plain script tag. Each code is compared with the saved
            snapshot and with the module version. Serve the folder over <code>http://localhost</code>.</p>

        <div id="summary" role="status" aria-live="polite">Running…</div>

        <section>
            <h2>Rendered codes (from the dist build)</h2>
            <div id="shots" class="grid"></div>
        </section>

        <section>
            <h2>Checks</h2>
            <ul id="results"></ul>
        </section>
    </main>

    <!-- 1. Remember which globals exist before the build loads. -->
    <script>
        window.__before = Object.keys(window);
    </script>

    <!-- 2. The build under test: one plain script tag, no type="module". -->
    <script src="dist/svg-codes.js"></script>

    <!-- 3. The tests. Also a plain script; dynamic import() is allowed here. -->
    <script>
        (function () {
            var shots = document.getElementById('shots');
            var results = document.getElementById('results');
            var summary = document.getElementById('summary');
            var counts = { pass: 0, fail: 0 };

            var LONG = 'The quick brown fox jumps over the lazy dog. '.repeat(4).trim();
            var SPECIAL_2D = 'Café ☕ 日本語 — "quotes" & <tags>';
            var ASCII_ALL = '!"#$%&\'()*+,-./:;<=>?@[\\]^_`{|}~';

            /* Same cases and ids as tests.html, so the snapshots match. */
            var cases = [
                { id: 'qr-short', name: 'QR short text', opts: { type: 'qr', msg: 'Hello svg-codes', size: 200 } },
                { id: 'qr-long', name: 'QR longer text', opts: { type: 'qr', msg: LONG, size: 200 } },
                { id: 'qr-url', name: 'QR URL', opts: { type: 'qr', msg: 'https://example.com/path?q=1&r=2#top', size: 200 } },
                { id: 'qr-special', name: 'QR special characters', opts: { type: 'qr', msg: SPECIAL_2D, size: 200 } },
                { id: 'qr-numeric', name: 'QR numeric', opts: { type: 'qr', msg: '0123456789012345', size: 200 } },
                { id: 'qr-h-mask3', name: 'QR level H, mask 3, no boost', opts: { type: 'qr', msg: 'Hello svg-codes', size: 200, qr: { ecl: 'H', mask: 3, boost: false } } },
                { id: 'qr-colors', name: 'QR colors', opts: { type: 'qr', msg: 'Hello', size: 200, colors: { fg: '#0c0c0c', bg: '#f0f8ff' } } },
                { id: 'qr-transparent', name: 'QR transparent', opts: { type: 'qr', msg: 'Hello', size: 200, colors: { bg: 'transparent' } } },
                { id: 'qr-verbose', name: 'QR verbose', opts: { type: 'qr', msg: 'Hello', size: 200, qr: { verbose: true } } },

                { id: 'dm-short', name: 'Data Matrix short text', opts: { type: 'datamatrix', msg: 'Hello svg-codes', size: 200 } },
                { id: 'dm-long', name: 'Data Matrix longer text', opts: { type: 'datamatrix', msg: LONG, size: 200 } },
                { id: 'dm-url', name: 'Data Matrix URL', opts: { type: 'datamatrix', msg: 'https://example.com/path?q=1&r=2#top', size: 200 } },
                { id: 'dm-special', name: 'Data Matrix special characters', opts: { type: 'datamatrix', msg: SPECIAL_2D, size: 200 } },
                { id: 'dm-numeric', name: 'Data Matrix numeric', opts: { type: 'datamatrix', msg: '0123456789012345', size: 200 } },
                { id: 'dm-rect', name: 'Data Matrix rectangular', opts: { type: 'datamatrix', msg: 'Hello', size: 200, datamatrix: { rect: true } } },
                { id: 'dm-colors', name: 'Data Matrix colors', opts: { type: 'datamatrix', msg: 'Hello', size: 200, colors: { fg: '#0c0c0c', bg: '#f0f8ff' } } },
                { id: 'dm-transparent', name: 'Data Matrix transparent', opts: { type: 'datamatrix', msg: 'Hello', size: 200, colors: { bg: 'transparent' } } },

                { id: 'c128-short', name: 'Code 128 short text', opts: { type: 'code128', msg: 'Hello svg-codes' } },
                { id: 'c128-long', name: 'Code 128 longer text', opts: { type: 'code128', msg: 'The quick brown fox jumps over', size: [600, 100] } },
                { id: 'c128-url', name: 'Code 128 URL', opts: { type: 'code128', msg: 'https://example.com/a?b=1', size: [480, 90] } },
                { id: 'c128-ascii', name: 'Code 128 all symbols', opts: { type: 'code128', msg: ASCII_ALL, size: [640, 100] } },
                { id: 'c128-numeric', name: 'Code 128 numeric', opts: { type: 'code128', msg: '1234567890' } },
                { id: 'c128-flip', name: 'Code 128 flip', opts: { type: 'code128', msg: 'Hello svg-codes', code128: { flip: true } } },
                { id: 'c128-vertical', name: 'Code 128 vertical', opts: { type: 'code128', msg: 'Hello', size: { width: 80, height: 240 }, code128: { vertical: true } } },
                { id: 'c128-vflip', name: 'Code 128 vertical + flip', opts: { type: 'code128', msg: 'Hello', size: { width: 80, height: 240 }, code128: { vertical: true, flip: true } } },
                { id: 'c128-colors', name: 'Code 128 colors', opts: { type: 'code128', msg: 'Hello', colors: { fg: '#0c0c0c', bg: '#f0f8ff' } } },
                { id: 'c128-transparent', name: 'Code 128 transparent', opts: { type: 'code128', msg: 'Hello', colors: { bg: 'transparent' } } }
            ];

            function addLine(ok, text) {
                var li = document.createElement('li');
                li.className = ok ? 'ok' : 'bad';
                var tag = document.createElement('b');
                tag.textContent = ok ? 'PASS' : 'FAIL';
                li.appendChild(tag);
                li.appendChild(document.createTextNode(text));
                results.appendChild(li);
                counts[ok ? 'pass' : 'fail']++;
            }

            function addShot(ok, name, svg) {
                var fig = document.createElement('figure');
                fig.className = ok ? 'ok' : 'bad';

                var box = document.createElement('div');
                box.className = 'box';
                if (svg) box.appendChild(svg);
                fig.appendChild(box);

                var cap = document.createElement('figcaption');
                var st = document.createElement('b');
                st.textContent = ok ? 'PASS' : 'FAIL';
                cap.appendChild(st);
                cap.appendChild(document.createTextNode(' ' + name));
                fig.appendChild(cap);

                shots.appendChild(fig);
            }

            function check(name, fn) {
                try {
                    addLine(!!fn(), name);
                } catch (e) {
                    addLine(false, name + ' threw: ' + e.message);
                }
            }

            function finish() {
                var total = counts.pass + counts.fail;
                summary.className = counts.fail ? 'bad' : 'ok';
                summary.textContent = counts.fail
                    ? counts.fail + ' failed, ' + counts.pass + ' passed.'
                    : 'All ' + total + ' checks passed.';
                document.title = (counts.fail ? 'FAIL' : 'PASS') + ' · svg-codes dist test';
            }

            /* ---------- Checks that need only the dist build ---------- */

            if (typeof SvgCodes === 'undefined') {
                addLine(false, 'SvgCodes global exists (dist/svg-codes.js did not load, run: node scripts/build.js)');
                finish();
                return;
            }

            var S = SvgCodes;

            check('SvgCodes global exists', function () { return typeof S === 'object'; });

            check('API has generate, toString, toDataURL, toPNG, TYPES, CodeError', function () {
                return ['generate', 'toString', 'toDataURL', 'toPNG', 'CodeError'].every(function (k) {
                    return typeof S[k] === 'function';
                }) && Array.isArray(S.TYPES);
            });

            check('TYPES = qr, datamatrix, code128', function () {
                return S.TYPES.join() === 'qr,datamatrix,code128';
            });

            check('aliases QRCode, DATAMatrix, BARCode exist on SvgCodes', function () {
                return [S.QRCode, S.DATAMatrix, S.BARCode].every(function (f) { return typeof f === 'function'; });
            });

            check('only SvgCodes was added to window', function () {
                var added = Object.keys(window).filter(function (k) {
                    return window.__before.indexOf(k) === -1 && k !== '__before';
                });
                return added.length === 1 && added[0] === 'SvgCodes';
            });

            check('QRCode, DATAMatrix, BARCode are not globals', function () {
                return ['QRCode', 'DATAMatrix', 'BARCode'].every(function (n) { return !(n in window); });
            });

            /* Errors */
            [
                ['empty text', { type: 'qr', msg: '' }, 'Enter some text'],
                ['unknown type', { type: 'aztec', msg: 'x' }, 'Allowed types'],
                ['qr too long', { type: 'qr', msg: 'x'.repeat(8000) }, 'Too much text'],
                ['datamatrix too long', { type: 'datamatrix', msg: 'x'.repeat(5000) }, 'Too much text'],
                ['code128 accented letter', { type: 'code128', msg: 'café' }, 'é'],
                ['bad foreground color', { type: 'qr', msg: 'x', colors: { fg: 'red' } }, 'hex']
            ].forEach(function (c) {
                try {
                    S.generate(c[1]);
                    addLine(false, 'throws: ' + c[0] + ' (no error was thrown)');
                } catch (e) {
                    var ok = e instanceof S.CodeError && e.message.indexOf(c[2]) !== -1;
                    addLine(ok, 'throws: ' + c[0] + ' -> ' + e.message);
                }
            });

            /* ---------- Compare with snapshots and the module version ---------- */

            Promise.all([import('./tests/snapshots.js'), import('./src/index.js')]).then(function (mods) {
                var snapshots = mods[0].snapshots;
                var M = mods[1];

                cases.forEach(function (c) {
                    var svg;
                    var text;

                    try {
                        svg = S.generate(c.opts);
                        text = S.toString(svg);
                    } catch (e) {
                        addLine(false, c.name + ' threw: ' + e.message);
                        addShot(false, c.name, null);
                        return;
                    }

                    var moduleText = M.toSvgString(M.generate(c.opts));
                    var saved = Object.prototype.hasOwnProperty.call(snapshots, c.id) ? snapshots[c.id] : undefined;

                    var sameAsModule = text === moduleText;
                    var sameAsSnapshot = saved !== undefined && text === saved;
                    var ok = sameAsModule && sameAsSnapshot;

                    var why = [];
                    if (!sameAsModule) why.push('differs from the module version');
                    if (saved === undefined) why.push('no snapshot saved');
                    else if (!sameAsSnapshot) why.push('differs from the snapshot');

                    addLine(ok, c.name + (ok ? '' : ' (' + why.join(', ') + ')'));
                    addShot(ok, c.name, svg);
                });

                check('toDataURL decodes back to the SVG text', function () {
                    var svg = S.generate({ type: 'datamatrix', msg: 'round trip' });
                    var url = S.toDataURL(svg);
                    return url.indexOf('data:image/svg+xml') === 0 &&
                        decodeURIComponent(url.slice(url.indexOf(',') + 1)) === S.toString(svg);
                });

                return S.toPNG(S.generate({ type: 'qr', msg: 'png' }), { scale: 2, background: '#ffffff' })
                    .then(function (blob) {
                        addLine(blob.type === 'image/png' && blob.size > 0, 'toPNG returns a PNG blob (' + blob.size + ' bytes)');
                    });
            }).catch(function (e) {
                addLine(false, 'could not load the module files: ' + (e && e.message ? e.message : e) +
                    ' (open this page over http://localhost, not file://)');
            }).then(finish);
        })();
    </script>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="favicon.ico">
    <title>Vendor wrap test</title>
    <style>
        body {
            background: #0c0c0c;
            color: #f0f8ff;
            font: 16px system-ui, sans-serif;
            margin: 0;
            padding: 16px;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
        }

        section {
            border-top: 1px solid rgba(240, 248, 255, .2);
            padding: 16px 0;
        }

        h2 {
            font-size: 16px;
            margin: 0 0 12px;
        }

        .box {
            background: #fff;
            display: inline-block;
            max-width: 100%;
        }

        .box svg {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .ok {
            color: #7fd48a;
        }

        .bad {
            color: #ff7b7b;
        }
    </style>
</head>

<body>
    <main>
        <h1>Vendor wrap test</h1>
        <section>
            <h2>QR Code</h2>
            <div id="qr"></div>
            <p id="qr-s"></p>
        </section>
        <section>
            <h2>Data Matrix</h2>
            <div id="dm"></div>
            <p id="dm-s"></p>
        </section>
        <section>
            <h2>Code 128</h2>
            <div id="bc"></div>
            <p id="bc-s"></p>
        </section>
        <section>
            <h2>Globals left behind</h2>
            <p id="globals"></p>
        </section>
    </main>

    <script type="module">
        import { QRCode } from './src/vendor/qrcode.js';
        import { DATAMatrix } from './src/vendor/datamatrix.js';
        import { BARCode } from './src/vendor/barcode.js';

        function show(id, fn, opts) {
            const box = document.createElement('div');
            const status = document.getElementById(id + '-s');
            box.className = 'box';
            try {
                box.appendChild(fn(opts));
                status.textContent = 'OK: rendered';
                status.className = 'ok';
            } catch (e) {
                status.textContent = 'FAIL: ' + e;
                status.className = 'bad';
            }
            document.getElementById(id).appendChild(box);
        }

        show('qr', QRCode, { msg: 'Hello svg-codes', dim: 200 });
        show('dm', DATAMatrix, { msg: 'Hello svg-codes', dim: 200 });
        show('bc', BARCode, { msg: 'Hello svg-codes', dim: [320, 80] });

        const leaked = ['QRCode', 'DATAMatrix', 'BARCode'].filter(n => n in window);
        const g = document.getElementById('globals');
        g.textContent = leaked.length ? 'FAIL: ' + leaked.join(', ') : 'OK: none';
        g.className = leaked.length ? 'bad' : 'ok';
    </script>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="favicon.ico">
    <title>API test</title>
    <style>
        body {
            background: #0c0c0c;
            color: #f0f8ff;
            font: 16px system-ui, sans-serif;
            margin: 0;
            padding: 16px;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
        }

        section {
            border-top: 1px solid rgba(240, 248, 255, .2);
            padding: 16px 0;
        }

        h2 {
            font-size: 16px;
            margin: 0 0 12px;
        }

        .box {
            background: #fff;
            display: inline-block;
            margin: 0 8px 8px 0;
            max-width: 100%;
            vertical-align: top;
        }

        .box svg {
            display: block;
            max-width: 100%;
            height: auto;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        li {
            padding: 2px 0;
            overflow-wrap: anywhere;
        }

        .ok {
            color: #7fd48a;
        }

        .bad {
            color: #ff7b7b;
        }
    </style>
</head>

<body>
    <main>
        <h1>API test</h1>
        <section>
            <h2>Rendered codes</h2>
            <div id="shots"></div>
        </section>
        <section>
            <h2>Checks</h2>
            <ul id="results"></ul>
        </section>
    </main>

    <script type="module">
        import {
            generate, toSvgString, toString as toStr, toDataURL, toPNG,
            TYPES, QRCode, DATAMatrix, BARCode
        } from './src/index.js';

        const shots = document.getElementById('shots');
        const results = document.getElementById('results');

        function line(ok, text) {
            const li = document.createElement('li');
            li.className = ok ? 'ok' : 'bad';
            li.textContent = (ok ? 'PASS  ' : 'FAIL  ') + text;
            results.appendChild(li);
        }

        function render(name, opts) {
            try {
                const svg = generate(opts);
                const box = document.createElement('div');
                box.className = 'box';
                box.title = name;
                box.appendChild(svg);
                shots.appendChild(box);
                line(svg instanceof SVGElement, 'renders: ' + name);
            } catch (e) {
                line(false, 'renders: ' + name + ' -> ' + e.message);
            }
        }

        function fails(name, opts, mustContain) {
            try {
                generate(opts);
                line(false, 'throws: ' + name + ' (no error thrown)');
            } catch (e) {
                const ok = e.message.length > 0 && (!mustContain || e.message.includes(mustContain));
                line(ok, 'throws: ' + name + ' -> ' + e.message);
            }
        }

        /* One call per type */
        render('qr default', { type: 'qr', msg: 'Hello svg-codes', size: 180 });
        render('qr H, mask 3, no boost', { type: 'qr', msg: 'Hello svg-codes', size: 180, qr: { ecl: 'H', mask: 3, boost: false } });
        render('qr colors', { type: 'qr', msg: 'https://example.com', size: 180, colors: { fg: '#0c0c0c', bg: '#f0f8ff' } });
        render('qr transparent', { type: 'qr', msg: 'Hello', size: 180, colors: { bg: 'transparent' } });
        render('datamatrix default', { type: 'datamatrix', msg: 'Hello svg-codes', size: 180 });
        render('datamatrix rect', { type: 'datamatrix', msg: 'Hello', size: 180, datamatrix: { rect: true } });
        render('code128 default', { type: 'code128', msg: 'Hello svg-codes' });
        render('code128 flip', { type: 'code128', msg: 'Hello svg-codes', code128: { flip: true } });
        render('code128 vertical', { type: 'code128', msg: 'Hello', size: { width: 80, height: 240 }, code128: { vertical: true } });

        /* Errors */
        fails('empty text', { type: 'qr', msg: '' });
        fails('unknown type', { type: 'aztec', msg: 'x' }, 'Allowed types');
        fails('code128 bad char', { type: 'code128', msg: 'café' }, 'é');
        fails('qr too long', { type: 'qr', msg: 'x'.repeat(8000) }, 'Too much text');
        fails('datamatrix too long', { type: 'datamatrix', msg: 'x'.repeat(5000) }, 'Too much text');
        fails('bad color', { type: 'qr', msg: 'x', colors: { fg: 'red' } }, 'hex');
        fails('bad qr level', { type: 'qr', msg: 'x', qr: { ecl: 'Z' } }, 'L, M, Q, H');
        fails('code128 padding too big', { type: 'code128', msg: 'x', padding: 200 }, 'Padding');

        /* Helpers and aliases */
        const sample = generate({ type: 'qr', msg: 'helpers' });
        line(toSvgString(sample).startsWith('<svg'), 'toSvgString returns SVG text');
        line(toStr === toSvgString, 'toString is an alias of toSvgString');
        line(toDataURL(sample).startsWith('data:image/svg+xml'), 'toDataURL returns a data URL');
        line([QRCode, DATAMatrix, BARCode].every(f => typeof f === 'function'), 'aliases QRCode, DATAMatrix, BARCode exist');
        line(TYPES.join() === 'qr,datamatrix,code128', 'TYPES = ' + TYPES.join(', '));

        try {
            const blob = await toPNG(sample, { scale: 2, background: '#ffffff' });
            line(blob.type === 'image/png' && blob.size > 0, 'toPNG returns a PNG blob (' + blob.size + ' bytes)');
        } catch (e) {
            line(false, 'toPNG -> ' + e.message);
        }

        const leaked = ['QRCode', 'DATAMatrix', 'BARCode'].filter(n => n in window);
        line(leaked.length === 0, 'no globals left behind');
    </script>
</body>

</html>
